# Development override (ADR-0004). Isolated from prod: own project name, volume, network, database and role.
# Host ports bind to loopback only.

name: savesphere-dev

x-database-connection: &database-connection
  ConnectionStrings__Default: "Host=postgres;Port=5432;Database=savesphere_dev;Username=savesphere_dev;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your env file (see the README section Local environment)};Timeout=10"

services:
  postgres:
    environment:
      POSTGRES_DB: savesphere_dev
      POSTGRES_USER: savesphere_dev
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"

  migrator:
    environment:
      <<: *database-connection
      DOTNET_ENVIRONMENT: Development

  api:
    environment:
      <<: *database-connection
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "127.0.0.1:${API_HOST_PORT:-58080}:8080"
